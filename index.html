<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#f8fafc" />
  <title>Taxi Protection</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="screen">
    <div class="notice" id="notice"><span>🔕</span><div><strong>Notifications are off</strong><small>You may miss ride offers and updates.</small></div><button>›</button></div>

    <section class="map-stage">
      <div id="map" class="map"></div>
      <div id="map-error" class="map-error" hidden>Google Maps APIキーを設定すると現在地を表示します。</div>
      <button class="profile-button" aria-label="profile">●</button>
      <div class="pickup-pill"><span class="pickup-dot"></span><span id="pickup-label">Current location</span></div>
    </section>

    <section class="bottom-sheet">
      <div class="grabber"></div>
      <div class="greeting"><h1>Hi 👋</h1><p>Where are you headed?</p></div>

      <div class="destination-search">
        <span>⌕</span>
        <input id="destination-input" placeholder="Where to?" autocomplete="off" />
        <button id="schedule-button">◷ Now</button>
      </div>

      <div class="service-grid">
        <button class="service-card active" data-service="ride"><span class="service-icon">🚕</span><strong>Ride</strong><small>Book a car</small></button>
        <button class="service-card" data-service="parcel"><span class="service-icon">📦</span><strong>Parcel</strong><small>Send a package</small></button>
      </div>

      <div class="section-title">SAVED PLACES</div>
      <div class="list-card">
        <button class="place-row"><span class="round-icon">⌂</span><span><strong>Home</strong><small>Set your home address</small></span><b>＋</b></button>
        <button class="place-row"><span class="round-icon">▣</span><span><strong>Work</strong><small>Set your work address</small></span><b>＋</b></button>
      </div>

      <div class="section-title">RECENT</div>
      <div class="list-card">
        <button class="place-row recent" data-place="Nadi"><span class="round-icon">◷</span><span><strong>Nadi</strong><small>Nadi, Fiji</small></span><b>›</b></button>
        <button class="place-row recent" data-place="Naboutini"><span class="round-icon">◷</span><span><strong>Naboutini</strong><small>Naboutini, Nadi, Fiji</small></span><b>›</b></button>
      </div>

      <div class="protection-card">
        <div><small>🛡 TAXI PROTECTION</small><strong>Fare protection runs automatically after you choose a ride.</strong></div>
        <button>View</button>
      </div>
    </section>
  </main>
  <script src="./app.js"></script>
</body>
</html>
